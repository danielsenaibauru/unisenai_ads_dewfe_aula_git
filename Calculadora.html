<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Básica</title>
    <link rel="stylesheet" href="css/Calculadora.css">
</head>

<body>
    <div class="calculator">
        <h1>Calculadora do Negrão</h1>

        <div class="display">
            <input type="text" id="display" readonly>
        </div>

        <div class="buttons">
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn operator" data-operator="/">/</button>
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn operator" data-operator="*">*</button>
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn operator" data-operator="-">-</button>
            <button class="btn">0</button>
            <button class="btn">.</button>
            <button class="btn equal">=</button>
            <button class="btn operator" data-operator="+">+</button>
            <button id="clear">C</button>
        </div>
        <script src="js/Calculadora.js"></script>
</body>

</html>
<style>
    body {
        background: linear-gradient(135deg, #1e1e2f, #3a3a55);
        font-family: 'Poppins', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #fff;
        margin: 0;
    }

    .calculator {
        background: #2b2b3d;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        width: 320px;
    }

    .calculator h1 {
        text-align: center;
        margin-bottom: 15px;
        font-weight: 600;
        color: #2d0ec5;
        font-size: 1.5rem;
    }

    .display input {
        width: 100%;
        height: 50px;
        font-size: 1.4rem;
        border: none;
        outline: none;
        border-radius: 10px;
        text-align: right;
        padding-right: 10px;
        background: #1a1a25;
        color: #2d0ec5;
        margin-bottom: 15px;
        box-sizing: border-box;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    button,
    #clear {
        height: 55px;
        font-size: 1.2rem;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
        background: #44445a;
        color: #fff;
    }

    button:hover {
        background: #2d0ec5;
        color: #000;
    }

    .operator {
        background: #ec0c10;
    }

    .equal {
        background: #2d0ec5;
        color: #000;
        font-weight: bold;
    }

    #clear {
        grid-column: span 4;
        background: #ec0c10;
        font-weight: bold;
    }
    }
</style>
</head>

<script>
    var display = document.getElementById('display');
    var buttons = document.querySelectorAll('.btn');
    var clearButton = document.getElementById('clear');
    var currentInput = '';
    console.log("Sistema embutido iniciado!");
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].addEventListener('click', function () {
            var value = this.textContent;
            console.log("Botão clicado:", value);
            if (value === '=') {
                try {
                    var resultado = eval(currentInput);
                    display.value = resultado;
                    currentInput = resultado.toString();
                } catch (error) {
                    display.value = "Erro";
                    currentInput = '';
                }
            } else {
                currentInput += value;
                display.value = currentInput;
            }
        });
    }
    if (clearButton) {
        clearButton.addEventListener('click', function () {
            console.log("Botão Limpar clicado");
            currentInput = '';
            display.value = '';
        });
    }
</script>
</body>

</html>
